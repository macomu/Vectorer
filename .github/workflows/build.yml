name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build & Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_path: artifacts/packages/Vectorer-win-x64.zip
          - rid: win-arm64
            os: windows-latest
            archive_path: artifacts/packages/Vectorer-win-arm64.zip
          - rid: osx-arm64
            os: macos-latest
            archive_path: artifacts/packages/Vectorer-osx-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, and package (${{ matrix.rid }})
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet run build.cs -- --rid ${{ matrix.rid }} --configuration Release

      - name: Build, test, and package release (${{ matrix.rid }})
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet run build.cs -- --rid ${{ matrix.rid }} --configuration Release --version ${{ github.ref_name }}

      - name: Upload build artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: Vectorer-${{ matrix.rid }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Vectorer-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum Vectorer-* > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Vectorer $TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi

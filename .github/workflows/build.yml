name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build & Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_path: artifacts/packages/Vectorer-win-x64.zip
          - rid: win-arm64
            os: windows-11-arm
            archive_path: artifacts/packages/Vectorer-win-arm64.zip
          - rid: osx-arm64
            os: macos-15
            archive_path: artifacts/packages/Vectorer-osx-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, and package (${{ matrix.rid }})
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet run build.cs -- --rid ${{ matrix.rid }} --configuration Release

      - name: Build, test, and package release (${{ matrix.rid }})
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NuGetAudit: 'true'
          NuGetAuditMode: all
          WarningsAsErrors: NU1900;NU1901;NU1902;NU1903;NU1904;NU1905
        run: |
          dotnet restore Vectorer.slnx --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/Vectorer.App/Vectorer.App.csproj -r ${{ matrix.rid }} -p:SelfContained=true --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run build.cs -- --rid ${{ matrix.rid }} --configuration Release --version $env:RELEASE_TAG

      - name: Upload build artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: Vectorer-${{ matrix.rid }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Prepare a draft GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Vectorer-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum Vectorer-win-x64.zip Vectorer-win-arm64.zip Vectorer-osx-arm64.tar.gz > SHA256SUMS.txt

      - name: Attach verified build outputs to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=(--draft --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            echo "::error::A release already exists for $TAG. Its assets were left intact."
            exit 1
          fi

          gh release create "$TAG" dist/* --title "Vectorer $TAG" --generate-notes "${FLAGS[@]}"

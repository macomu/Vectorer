name: Bug Report / バグ報告
description: 不具合やクラッシュを報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要 / Summary
      description: 発生している問題の内容を簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to Reproduce
      description: 問題が発生するまでの操作手順を記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作 / Expected Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vectorer バージョン / Version
      placeholder: 例: v0.1.0 / main (commit hash)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS 環境 / Operating System
      options:
        - Windows (x64)
        - Windows (ARM64)
        - macOS (Apple Silicon / ARM64)
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 補足・スクリーンショット・エラーログ / Additional Context
      description: 差し支えなければ現象が再現する SVG サンプルやログも添付してください。
